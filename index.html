<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8f4">
    <title>Daylist — a little more done</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --paper: #f7f8f4;
        --ink: #202522;
        --muted: #7a817c;
        --line: #e4e8e1;
        --green: #2d6b50;
        --green-soft: #e7f0e9;
        --coral: #bd5a43;
        --white: #fff;
        font-family: "DM Sans", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background-color: var(--paper);
        background-image: radial-gradient(#d9e0d7 0.65px, transparent 0.65px);
        background-size: 18px 18px;
      }

      button, input { font: inherit; }
      button { color: inherit; }

      .shell {
        width: min(100% - 40px, 720px);
        margin: 0 auto;
        padding: 35px 0 72px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 29px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--ink);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 27px;
        height: 27px;
        place-items: center;
        border-radius: 8px;
        color: #fff;
        background: var(--green);
      }

      .brand-mark svg { width: 15px; height: 15px; }

      .date-label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      main { padding-top: 51px; }

      .eyebrow {
        margin: 0 0 9px;
        color: var(--green);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: "Newsreader", Georgia, serif;
        font-size: clamp(38px, 8vw, 52px);
        font-weight: 500;
        line-height: 1.08;
      }

      .summary {
        min-height: 22px;
        margin: 12px 0 31px;
        color: var(--muted);
        font-size: 14px;
      }

      .composer {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 58px;
        padding: 7px 8px 7px 17px;
        border: 1px solid #dce2d9;
        border-radius: 10px;
        background: var(--white);
        box-shadow: 0 3px 12px rgb(32 37 34 / 4%);
      }

      .composer:focus-within {
        border-color: #91ad9b;
        box-shadow: 0 0 0 3px rgb(45 107 80 / 10%);
      }

      .composer input {
        min-width: 0;
        flex: 1;
        padding: 8px 0;
        border: 0;
        outline: 0;
        color: var(--ink);
        background: transparent;
        font-size: 14px;
      }

      .composer input::placeholder { color: #9aa19c; }

      .add-button {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 0 14px;
        border: 0;
        border-radius: 7px;
        color: #fff;
        background: var(--green);
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: background 150ms ease, transform 150ms ease;
      }

      .add-button:hover { background: #24583f; }
      .add-button:active { transform: translateY(1px); }
      .add-button svg { width: 15px; height: 15px; }

      .list-toolbar {
        display: flex;
        min-height: 67px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--line);
      }

      .filters { display: flex; align-items: center; gap: 5px; }

      .filter-button {
        min-height: 34px;
        padding: 0 11px;
        border: 0;
        border-radius: 6px;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
      }

      .filter-button:hover { color: var(--ink); }
      .filter-button[aria-pressed="true"] { color: var(--green); background: var(--green-soft); }

      .clear-button {
        padding: 7px 0 7px 8px;
        border: 0;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        font-size: 12px;
      }

      .clear-button:hover { color: var(--coral); }
      .clear-button:disabled { visibility: hidden; cursor: default; }

      .task-list { margin: 0; padding: 0; list-style: none; }

      .task-row {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr) 34px;
        align-items: center;
        gap: 13px;
        min-height: 62px;
        border-bottom: 1px solid var(--line);
        animation: arrive 220ms ease both;
      }

      @keyframes arrive {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .check-button {
        display: grid;
        width: 21px;
        height: 21px;
        place-items: center;
        padding: 0;
        border: 1.5px solid #b8c1ba;
        border-radius: 50%;
        color: white;
        background: transparent;
        cursor: pointer;
        transition: border-color 140ms ease, background 140ms ease;
      }

      .check-button:hover { border-color: var(--green); }
      .check-button svg { width: 12px; height: 12px; opacity: 0; }
      .task-row.is-done .check-button { border-color: var(--green); background: var(--green); }
      .task-row.is-done .check-button svg { opacity: 1; }

      .task-text {
        overflow-wrap: anywhere;
        padding: 13px 0;
        font-size: 14px;
        line-height: 1.5;
      }

      .task-row.is-done .task-text { color: #929993; text-decoration: line-through; }

      .delete-button {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 6px;
        color: #9aa19c;
        background: transparent;
        cursor: pointer;
        opacity: 0;
        transition: opacity 120ms ease, color 120ms ease, background 120ms ease;
      }

      .task-row:hover .delete-button,
      .delete-button:focus-visible { opacity: 1; }
      .delete-button:hover { color: var(--coral); background: #f8ebe7; }
      .delete-button svg { width: 16px; height: 16px; }

      .empty-state {
        display: grid;
        min-height: 195px;
        place-content: center;
        justify-items: center;
        gap: 8px;
        color: var(--muted);
        text-align: center;
      }

      .empty-icon {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        margin-bottom: 3px;
        border-radius: 12px;
        color: var(--green);
        background: var(--green-soft);
      }

      .empty-icon svg { width: 19px; height: 19px; }
      .empty-state strong { color: var(--ink); font-size: 14px; font-weight: 600; }
      .empty-state span { font-size: 12px; }

      .storage-note {
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 11px;
        text-align: center;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }

      :focus-visible { outline: 3px solid rgb(45 107 80 / 35%); outline-offset: 2px; }

      @media (max-width: 520px) {
        .shell { width: min(100% - 32px, 720px); padding-top: 23px; }
        main { padding-top: 39px; }
        .summary { margin-bottom: 25px; }
        .composer { gap: 8px; padding-left: 13px; }
        .add-button { width: 42px; padding: 0; }
        .add-button span { display: none; }
        .list-toolbar { min-height: 62px; }
        .filters { gap: 0; }
        .filter-button { padding: 0 9px; }
        .delete-button { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Daylist home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 20 20" fill="none"><path d="m5 10.5 3.2 3.2L15.5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span>daylist</span>
        </a>
        <time class="date-label" id="today"></time>
      </header>

      <main>
        <p class="eyebrow">Your space, your pace</p>
        <h1>Make room for<br>what matters.</h1>
        <p class="summary" id="summary" aria-live="polite"></p>

        <form class="composer" id="task-form">
          <label class="sr-only" for="task-input">Add a task</label>
          <input id="task-input" name="task" type="text" maxlength="200" placeholder="What would you like to get done?" autocomplete="off" required>
          <button class="add-button" type="submit" aria-label="Add task">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span>Add task</span>
          </button>
        </form>

        <section aria-label="Tasks">
          <div class="list-toolbar">
            <div class="filters" role="group" aria-label="Filter tasks">
              <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
              <button class="filter-button" type="button" data-filter="active" aria-pressed="false">To do</button>
              <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Done</button>
            </div>
            <button class="clear-button" id="clear-completed" type="button" disabled>Clear completed</button>
          </div>
          <ul class="task-list" id="task-list" aria-label="Your tasks"></ul>
          <div class="empty-state" id="empty-state" hidden>
            <span class="empty-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M7 4.75h10A2.25 2.25 0 0 1 19.25 7v12A1.25 1.25 0 0 1 18 20.25H6A1.25 1.25 0 0 1 4.75 19V7A2.25 2.25 0 0 1 7 4.75Z" stroke="currentColor" stroke-width="1.5"/><path d="M8.5 9h7m-7 4h7m-7 4h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </span>
            <strong id="empty-title">A clear start.</strong>
            <span id="empty-copy">Add a task above and take it one step at a time.</span>
          </div>
        </section>
        <p class="storage-note">Your list stays on this device.</p>
      </main>
    </div>

    <script>
      const STORAGE_KEY = "daylist.tasks.v1";
      const form = document.querySelector("#task-form");
      const input = document.querySelector("#task-input");
      const taskList = document.querySelector("#task-list");
      const summary = document.querySelector("#summary");
      const emptyState = document.querySelector("#empty-state");
      const emptyTitle = document.querySelector("#empty-title");
      const emptyCopy = document.querySelector("#empty-copy");
      const clearCompletedButton = document.querySelector("#clear-completed");
      const filterButtons = [...document.querySelectorAll("[data-filter]")];
      let tasks = loadTasks();
      let currentFilter = "all";

      document.querySelector("#today").textContent = new Intl.DateTimeFormat(undefined, {
        weekday: "short",
        month: "short",
        day: "numeric"
      }).format(new Date());

      function loadTasks() {
        try {
          const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          if (!Array.isArray(stored)) return [];
          return stored.filter((task) =>
            task && typeof task.id === "string" && typeof task.text === "string" && typeof task.completed === "boolean"
          );
        } catch {
          return [];
        }
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch {
          summary.textContent = "Storage is unavailable, so this list may not be saved.";
        }
      }

      function createIcon(markup) {
        const template = document.createElement("template");
        template.innerHTML = markup;
        return template.content.firstElementChild;
      }

      function render() {
        const remaining = tasks.filter((task) => !task.completed).length;
        summary.textContent = tasks.length === 0
          ? "A fresh page for your thoughts."
          : remaining === 0
            ? "Everything is done. Take a breath."
            : `${remaining} ${remaining === 1 ? "task" : "tasks"} left to focus on.`;

        const visibleTasks = tasks.filter((task) => {
          if (currentFilter === "active") return !task.completed;
          if (currentFilter === "completed") return task.completed;
          return true;
        });
        taskList.replaceChildren(...visibleTasks.map(createTaskRow));
        taskList.hidden = visibleTasks.length === 0;
        emptyState.hidden = visibleTasks.length > 0;
        clearCompletedButton.disabled = !tasks.some((task) => task.completed);

        if (tasks.length === 0) {
          emptyTitle.textContent = "A clear start.";
          emptyCopy.textContent = "Add a task above and take it one step at a time.";
        } else if (currentFilter === "active") {
          emptyTitle.textContent = "All caught up.";
          emptyCopy.textContent = "There are no tasks left to do.";
        } else {
          emptyTitle.textContent = "Nothing here yet.";
          emptyCopy.textContent = "Completed tasks will show up here.";
        }

        filterButtons.forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.filter === currentFilter));
        });
      }

      function createTaskRow(task) {
        const row = document.createElement("li");
        row.className = `task-row${task.completed ? " is-done" : ""}`;

        const toggle = document.createElement("button");
        toggle.className = "check-button";
        toggle.type = "button";
        toggle.setAttribute("aria-label", task.completed ? `Mark ${task.text} as to do` : `Mark ${task.text} as done`);
        toggle.setAttribute("aria-pressed", String(task.completed));
        toggle.append(createIcon('<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m3.5 8.2 2.8 2.7 6.2-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'));
        toggle.addEventListener("click", () => {
          task.completed = !task.completed;
          saveTasks();
          render();
        });

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const remove = document.createElement("button");
        remove.className = "delete-button";
        remove.type = "button";
        remove.setAttribute("aria-label", `Delete ${task.text}`);
        remove.append(createIcon('<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 6h10m-8.5 0 .6 9.3c.05.8.7 1.4 1.5 1.4h2.8c.8 0 1.45-.6 1.5-1.4L13.5 6M8 6V4.5h4V6m-3.5 3v4m3-4v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'));
        remove.addEventListener("click", () => {
          tasks = tasks.filter((item) => item.id !== task.id);
          saveTasks();
          render();
        });

        row.append(toggle, text, remove);
        return row;
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        tasks.unshift({ id: crypto.randomUUID(), text, completed: false });
        currentFilter = "all";
        saveTasks();
        render();
        input.value = "";
        input.focus();
      });

      filterButtons.forEach((button) => {
        button.addEventListener("click", () => {
          currentFilter = button.dataset.filter;
          render();
        });
      });

      clearCompletedButton.addEventListener("click", () => {
        tasks = tasks.filter((task) => !task.completed);
        saveTasks();
        render();
      });

      render();
    </script>
  </body>
</html>
